name: PR Review

# Single-job review (3-dim). Security gate removed per session request.
# Workflow: /dev-kit:review only. No security.yml, no severity gate.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review (workflow_dispatch only)"
        required: false
        type: string
concurrency:
  group: review-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    # Fork-safety: only run the agent on PRs from the same repo
    # (PRs from forks can't access secrets and would fail anyway).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: /dev-kit:review (3-dim)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      EVENT_NAME: ${{ github.event_name }}

    steps:
      - name: Set up job
        run: echo "review job starting"

      - name: Run actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Install dev-kit plugin
        run: |
          mkdir -p ~/.claude/plugins/marketplaces
          ln -sf "$GITHUB_WORKSPACE" ~/.claude/plugins/marketplaces/dev-kit
          ls -la ~/.claude/plugins/marketplaces/

      - name: Resolve PR + provider
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Run /dev-kit:review via MiniMax
        if: steps.resolve.outputs.PR_NUMBER != ''
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.MINIMAX_BASE_URL || 'https://api.minimax.io/v1' }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          python3 -m lib.ci_setup review --pr-number "${{ steps.resolve.outputs.PR_NUMBER }}"

      - name: Detect bootstrap-PR fallback
        if: always()
        id: detect
        run: |
          # If the agent job ran and produced no claude-prefixed comment,
          # this is the bootstrap-PR case (PR modifies .github/workflows/*).
          if [ "${{ steps.review.outcome }}" = "success" ] && [ -z "$(gh pr comments "${{ steps.resolve.outputs.PR_NUMBER }}" --json body -q '.[] | select(.body | startswith(\"## /dev-kit:review\")) | .body')" ]; then
            echo "verdict_source=needs-fallback-bootstrap-pr" >> "$GITHUB_OUTPUT"
          else
            echo "verdict_source=default-approve-no-file" >> "$GITHUB_OUTPUT"
          fi

      - name: Post fallback verdict comment (review)
        if: steps.detect.outputs.verdict_source == 'needs-fallback-bootstrap-pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ steps.resolve.outputs.PR_NUMBER }}" --body "## /dev-kit:review (fallback)

Verdict: **Approve** (fallback — bootstrap-PR detected)

This PR modifies \`.github/workflows/*\`, so the dev-kit agent skipped the
review (anti-recursion guard). The gate defaults to Approve per the
empty-verdict contract; the human-gate (REVIEW_REQUIRED / CHANGES_REQUESTED)
on this PR is what actually blocks merge, not the agent verdict.

To re-run the agent after the workflow change is merged, push a fresh
commit to a non-workflow path."

      - name: Extract review verdict
        if: always()
        id: extract_verdict
        run: |
          # Look for the verdict line in any comment by /dev-kit:review
          VERDICT=$(gh pr comments "${{ steps.resolve.outputs.PR_NUMBER }}" --json body -q '.[] | select(.body | startswith(\"## /dev-kit:review\")) | .body' 2>/dev/null | grep -E 'Verdict:.*\\*\\*(Approve|Changes Requested|Blocked)\\*\\*' | head -1 | sed -E 's/.*\\*\\*([A-Za-z ]+)\\*\\*.*/\\1/' || true)
          if [ -z "$VERDICT" ]; then
            # Fall back to /dev/kit/review verdict line
            VERDICT=$(gh pr comments "${{ steps.resolve.outputs.PR_NUMBER }}" --json body -q '.[] | select(.body | contains(\"Verdict:\")) | .body' 2>/dev/null | grep -oE 'Verdict:[[:space:]]+\\*\\*[A-Za-z ]+\\*\\*' | head -1 | sed -E 's/.*\\*\\*([A-Za-z ]+)\\*\\*.*/\\1/' || true)
          fi
          if [ -z "$VERDICT" ]; then
            VERDICT="PARSE_FAILED"
          fi
          echo "verdict=${VERDICT}" >> "$GITHUB_OUTPUT"
          echo "verdict_source=${{ steps.detect.outputs.verdict_source }}" >> "$GITHUB_OUTPUT"
          echo "agent_ran=${{ steps.review.conclusion == 'success' }}" >> "$GITHUB_OUTPUT"
          echo "review_verdict=${verdict}  source=${{ steps.detect.outputs.verdict_source }}  agent_ran=${{ steps.review.conclusion == 'success' }}"

      - name: Post Run /dev-kit:review via MiniMax
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          audit_body="<!-- dev-kit-verdict-audit --> run=${{ github.run_id }} job=review status=${{ job.status }} verdict=${{ steps.extract_verdict.outputs.verdict }} source=${{ steps.extract_verdict.outputs.verdict_source }}"
          gh pr comment "${{ steps.resolve.outputs.PR_NUMBER }}" --body "$audit_body"

      - name: Post Run actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: always()
        run: echo "review job done"

      - name: Complete job
        if: always()
        run: echo "complete"

      # Exit code: success if Approve, failure if Changes Requested or Blocked
      - name: Fail if not Approve
        if: steps.extract_verdict.outputs.verdict != 'Approve' && steps.extract_verdict.outputs.verdict != ''
        run: |
          echo "Review verdict is '${{ steps.extract_verdict.outputs.verdict }}', not Approve"
          exit 1
