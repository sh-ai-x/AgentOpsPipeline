[project]
name = "agentops-workbench"
version = "0.2.0"
description = "LangGraph + MCP support-ops agent + 30-case benchmark workbench."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "sh-ai-x" }]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    # LangGraph + LangChain pinned (S1, S3)
    "langgraph==1.2.11",
    "langchain-core>=0.3",
    # Provider-agnostic chat-model wrapper; minimax uses OpenAI-compatible API (S5)
    "openai>=1.45",
    # Streamlit UI
    "streamlit>=1.39",
    # Worker process (Phase 5)
    "arq>=0.26",
    # Migrations (Phase 5)
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pytest-httpx>=0.34",
    "playwright>=1.47",
]
# ADR-0010: WikiRagAdapter's dense/hybrid/hybrid_rerank retrieval modes.
# Opt-in only -- pulls onnxruntime + tokenizers + huggingface-hub (CPU-only;
# no torch). tfidf/bm25 never import this; see
# tests/adapters/test_wiki_rag_lexical_frozen.py.
dense = [
    "fastembed>=0.7,<1.0",
]
# ADR-0011: real OpenTelemetry export for the wiki-chat path. Opt-in --
# `Tracer` falls back to its no-op bookkeeping recorder when this extra
# isn't installed; trace_exporter also defaults to "none", so installing
# this alone changes nothing until AGENTOPS_TRACE_EXPORTER is set.
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]
# Nested extra: only needed for AGENTOPS_TRACE_EXPORTER=otlp. HTTP/protobuf,
# not gRPC -- gRPC pulls the compiled `grpcio` wheel, the most frequent
# `uv sync` failure on arm64/Alpine and a bad fit for an 8GB CPU-only target
# (ADR-0010 §Context). `uv sync --extra otel --extra otlp` to enable.
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_workbench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
]
